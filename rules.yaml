# 分类的「种子与兜底」
# - 首次运行 python setup_notion.py 时，这里的分类会写进 Notion「分类配置」表
# - 之后请直接在 Notion「分类配置」表里增删改（改描述、加分类、取消启用），不用再改这个文件，也不用重新部署
# - 只有没配置 NOTION_DB_CONFIG，或配置表从未读取成功时，才临时使用这里的分类
categories:
  - name: "技术工具与开源"
    description: "开源项目、GitHub仓库、AI工具、开发框架、自动化脚本、部署教程、V2EX技术讨论"
    extraction_focus: "重点提炼：核心解决的痛点、技术栈/架构亮点、开源协议与部署前提、是否可复用。"
    tagging_rule: "从 [AI Agent, 自动化, 爬虫抓取, 云原生, 开源项目, Python, 效率工具, MCP] 中选1-3个，可补充最多1个具体工具名。"
    suggested_tags: []

  - name: "行业研报与专业洞察"
    description: "ESG法规政策、电池护照、供应链合规、碳管理、新能源/出海行业分析、深度微信公众号长文"
    extraction_focus: "重点提炼：核心政策/行业结论、关键数据指标与时间节点、对业务或合规的潜在影响；区分正式法规文本、实施指南与分析观点。"
    tagging_rule: "从 [ESG, 法规合规, 供应链, 碳中和, 电池行业, 欧洲市场, 深度长文] 中选1-3个，务必补充涉及的法规或机构缩写（如 PPWR、CBAM、EUR-Lex）。"
    suggested_tags: []

  - name: "社媒观点与灵感"
    description: "X/Twitter短评、Reddit社区热议、个人方法论、认知思考、产品灵感或纯文本随手记"
    extraction_focus: "重点提炼：作者的核心论点、支持论据或反常识视角；若含评论区（Reddit/V2EX），单独总结高赞共识或争议点。"
    tagging_rule: "从 [产品思维, 行业观察, 个人成长, 争议讨论, 灵感备忘] 中选1-2个，可补充1个主题词。"
    suggested_tags: []

  - name: "生活与休闲参考"
    description: "旅行攻略、美食探店、运动装备评测、影音书单、摄影技巧等非工作类内容"
    extraction_focus: "重点提炼：实用建议、具体地点/型号/价格参数及避坑要点。"
    tagging_rule: "从 [旅行, 美食, 运动户外, 摄影, 书影音, 好物清单] 中选1-2个，若含城市名则添加城市标签。"
    suggested_tags: []

  - name: "薅羊毛集合"
    description: "优惠活动与羊毛线报：限时免费、折扣领券、返现、银行/信用卡活动、App 新人福利、会员试用、云服务与软件免费额度、实物羊毛"
    extraction_focus: "重点提炼：能得到什么（金额/时长/实物）、参与条件与门槛、操作步骤、截止时间、适用平台与地区；单独列出风险点（自动续费、需绑卡、限新用户、需实名等）。"
    tagging_rule: "从 [限时免费, 优惠券, 返现, 信用卡活动, 新人福利, 会员试用, 云服务额度, 实物羊毛] 中选1-2个，务必补充平台或机构名（如 京东、淘宝、招行、Google Cloud）。"
    suggested_tags: []
